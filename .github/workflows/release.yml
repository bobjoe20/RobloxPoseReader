name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: cargo build --release

      - name: Hash
        shell: bash
        run: sha256sum target/x86_64-pc-windows-msvc/release/pxc-roblox.exe | tee sha256.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/x86_64-pc-windows-msvc/release/pxc-roblox.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pxc-roblox
          path: |
            target/x86_64-pc-windows-msvc/release/pxc-roblox.exe
            sha256.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by GitHub Actions from \`$GITHUB_SHA\`."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 sha256.txt)\`"
            echo
            echo "Check that this binary came from this repository:"
            echo
            echo '```'
            echo "gh attestation verify pxc-roblox.exe --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            target/x86_64-pc-windows-msvc/release/pxc-roblox.exe \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # The companion SDK from proximitycore.net. build.rs pins the DLL inside it by
  # hash too; move all three together.
  SDK_VERSION: 0.5.0
  SDK_SHA256: fda82e03152a66c1c0b46d7033f2424ba5e12f226d6511f6cc830666cf8a185a

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the companion SDK
        shell: pwsh
        run: |
          $sdk = "pxc-companion-sdk-$env:SDK_VERSION-windows-x64.zip"
          Invoke-WebRequest "https://proximitycore.net/downloads/$sdk" -OutFile $sdk
          if ((Get-FileHash $sdk -Algorithm SHA256).Hash -ne $env:SDK_SHA256) {
            throw "$sdk does not match its pinned hash"
          }
          Expand-Archive $sdk sdk
          if ((Get-AuthenticodeSignature sdk/proximity_companion.dll).Status -ne 'Valid') {
            throw "proximity_companion.dll is not validly signed"
          }

      - run: cargo build --release

      - name: Hash
        shell: bash
        run: sha256sum target/x86_64-pc-windows-msvc/release/pxc-roblox.exe | tee sha256.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/x86_64-pc-windows-msvc/release/pxc-roblox.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pxc-roblox
          path: |
            target/x86_64-pc-windows-msvc/release/pxc-roblox.exe
            sha256.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built by GitHub Actions from \`$GITHUB_SHA\`, with companion SDK $SDK_VERSION."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 sha256.txt)\`"
            echo
            echo "Check that this binary came from this repository:"
            echo
            echo '```'
            echo "gh attestation verify pxc-roblox.exe --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            target/x86_64-pc-windows-msvc/release/pxc-roblox.exe \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
